
<!-- ORDER DETAILS -->
<section id="order-details" class="auth-section">
  <h2>📦 Order Details</h2>
  <p>Enter your delivery information</p>

  <form id="order-form">
    <label for="customer-name">Full Name</label>
    <input
      type="text"
      id="customer-name"
      placeholder="Enter your full name"
      required
    >

    <label for="customer-phone">Phone Number</label>
    <input
      type="tel"
      id="customer-phone"
      placeholder="10-digit mobile number"
      pattern="[6-9][0-9]{9}"
      maxlength="10"
      required
    >

    <label for="customer-address">Delivery Address</label>
    <textarea
      id="customer-address"
      placeholder="House number, street, area"
      rows="3"
      required
    ></textarea>

    <label for="customer-city">City / Town</label>
    <input
      type="text"
      id="customer-city"
      placeholder="Enter your city"
      required
    >

    <label for="customer-pincode">PIN Code</label>
    <input
      type="text"
      id="customer-pincode"
      placeholder="6-digit PIN code"
      pattern="[0-9]{6}"
      maxlength="6"
      required
    >

    <h3>Order Summary</h3>
    <div id="order-summary">
      Your cart is empty.
    </div>

    <h3>Total Amount: ₹<span id="order-total">0</span></h3>

    <button type="submit">Place Order</button>
  </form>

  <p id="order-message" aria-live="polite"></p>
</section>
