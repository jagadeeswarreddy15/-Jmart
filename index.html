
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J-Mart | Online Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>🛒 J-Mart</h1>
    <p>Your Daily Needs, Delivered with Care!</p>
  </header>

  <nav class="navbar">
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#login">Login</a>
    <a href="#signup">Sign Up</a>
    <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
  </nav>

  <main>
    <section id="home" class="hero">
      <h2>Welcome to J-Mart</h2>
      <p>Shop your favourite products at great prices.</p>
      <a href="#products" class="shop-btn">Shop Now</a>
    </section>

    <section id="products" class="products-section">
      <h2>Our Products</h2>

      <input
        type="search"
        id="search"
        placeholder="Search products..."
        aria-label="Search products"
      >

      <div id="product-list" class="product-grid">
        <!-- Products are loaded from script.js -->
      </div>
    </section>

    <section id="cart" class="cart-section">
      <h2>🛒 Your Cart</h2>
      <div id="cart-items">Your cart is empty.</div>
      <h3>Total: ₹<span id="cart-total">0</span></h3>
      <button id="clear-cart" type="button">Clear Cart</button>
    </section>

    <section id="login" class="auth-section">
      <h2>Login</h2>
      <form id="login-form">
        <input type="email" id="login-email"
          placeholder="Email address" required>
        <input type="password" id="login-password"
          placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p id="login-message" aria-live="polite"></p>
    </section>

    <section id="signup" class="auth-section">
      <h2>Create an Account</h2>
      <form id="signup-form">
        <input type="text" id="signup-name"
          placeholder="Full name" required>
        <input type="email" id="signup-email"
          placeholder="Email address" required>
        <input type="password" id="signup-password"
          placeholder="Create password" minlength="8" required>
        <button type="submit">Sign Up</button>
      </form>
      <p id="signup-message" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <p>© 2026 J-Mart. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
